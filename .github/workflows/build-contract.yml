
name: Build CircleHub SputnikDAO Contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sputnikdao2/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/build-contract.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build NEAR contract
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
          targets: wasm32-unknown-unknown

      - name: Install cargo-near
        run: cargo install --locked cargo-near --version 0.17.0

      - name: Build reproducible WASM
        working-directory: sputnikdao2
        run: cargo near build reproducible-wasm

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: circlehub-sputnikdao-contract
          path: "sputnikdao2/target/**/*.wasm"
          if-no-files-found: error
          retention-days: 14
          
