name: Build CircleHub Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sputnikdao2/**'
      - 'sputnikdao-factory2/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/build-contract.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install cargo-near
        run: cargo install --locked cargo-near --version 0.17.0

      - name: Build DAO contract
        working-directory: sputnikdao2
        run: cargo near build reproducible-wasm

      - name: Build factory contract
        working-directory: sputnikdao-factory2
        run: cargo near build reproducible-wasm

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circlehub-contracts
          path: |
            target/near/sputnikdao2/sputnikdao2.wasm
            target/near/sputnikdao_factory2/sputnikdao_factory2.wasm
          if-no-files-found: error
          retention-days: 14
